groups:
  - name: ml.rules
    rules:
      - alert: HighInferenceLatency
        expr: histogram_quantile(0.95, sum(rate(batch_inference_latency_seconds_bucket[5m])) by (le)) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile inference latency > 1s"